services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: rails_api
    command: [ "bin/rails", "server", "-b", "0.0.0.0" ]
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/rails
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
  sidekiq:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sidekiq
    command: bash -c "sleep 5 && bundle exec sidekiq"
    volumes:
      - ./backend:/rails
      - ./backend/vendor/bundle:/rails/vendor/bundle
    depends_on:
      - backend
      - redis
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ./frontend:/app
    env_file:
      - ./frontend/.env
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  db:
    image: postgres:17
    container_name: gender-gap-db
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: gender-gap-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  bundle_cache:
